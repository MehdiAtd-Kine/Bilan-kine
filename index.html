<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <!-- Librairie QR Code -->

  <style>
    :root {
      --c-purple: #9B5DE5;
      --c-purple-dark: #3C1B70;
      --c-purple-light: #F3E8FF;
      --c-yellow: #F1C40F;
      --c-yellow-light: #FEF9E7;
      --c-green: #2ECC71;
      --c-bg: #FAF5FF;
      
      --card-bg: #FFFFFF;
      --border: #E9D5FF;
      --danger: #E74C3C;
      --warning: #E67E22;
      --shadow: 0 10px 30px rgba(60, 27, 112, 0.08);

      --joint-color: #F1C40F;
      --bone-color: #CFF7EA;
      --bone-stroke: #124D41;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--c-bg);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(155, 93, 229, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(241, 196, 15, 0.12) 0%, transparent 40%);
      background-attachment: fixed;
      color: var(--c-purple-dark);
      padding: 30px 15px 120px 15px;
      margin: 0;
      line-height: 1.5;
    }

    .container {
      max-width: 1060px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      padding: 40px;
      border-radius: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    header {
      border-bottom: 2px solid var(--c-purple-light);
      padding-bottom: 20px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .brand-header { display: flex; align-items: center; gap: 16px; }
    .brand-logo-svg {
      width: 58px;
      height: 58px;
      filter: drop-shadow(0 4px 10px rgba(60, 27, 112, 0.15));
    }

    h1 { margin: 0; font-size: 22px; color: var(--c-purple-dark); font-weight: 800; }
    .subtitle { font-size: 13px; color: var(--c-purple-dark); opacity: 0.8; margin-top: 2px; }

    /* MENU ANCRES */
    .sticky-nav {
      position: sticky; top: 15px; z-index: 1000;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 14px; padding: 8px 12px; margin-bottom: 35px;
      display: flex; justify-content: space-around; gap: 8px; overflow-x: auto;
      box-shadow: 0 4px 20px rgba(60, 27, 112, 0.08);
    }
    .nav-anchor {
      text-decoration: none; color: var(--c-purple-dark); font-size: 13px; font-weight: 700;
      padding: 8px 16px; border-radius: 8px; transition: all 0.2s; white-space: nowrap;
    }
    .nav-anchor:hover { background: var(--c-purple-light); color: var(--c-purple-dark); }

    .scroll-section {
      margin-bottom: 40px; padding-top: 10px;
      opacity: 0; transform: translateY(30px);
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .scroll-section.is-visible { opacity: 1; transform: translateY(0); }

    .section-title {
      font-size: 15px; font-weight: 800; color: var(--c-purple-dark);
      background: linear-gradient(90deg, var(--c-purple-light) 0%, var(--c-bg) 100%);
      padding: 12px 18px; border-left: 5px solid var(--c-purple); border-radius: 8px;
      margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;
    }

    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px 18px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .full-width { grid-column: 1 / -1; }

    .label-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    label { font-weight: 700; font-size: 13px; color: var(--c-purple-dark); display: block; margin: 0; }
    
    input[type="text"], input[type="date"], select, textarea, input[type="file"] {
      width: 100%; padding: 11px 14px; border: 1px solid var(--border);
      border-radius: 10px; font-size: 13.5px; box-sizing: border-box;
      background: #FFFFFF; color: var(--c-purple-dark); transition: all 0.2s;
    }
    input::placeholder, textarea::placeholder { color: var(--c-purple-dark) !important; opacity: 0.5; }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--c-purple);
      box-shadow: 0 0 0 3px rgba(155, 93, 229, 0.2);
    }
    textarea { min-height: 70px; resize: vertical; }

    .neutral-block { background: var(--c-bg); padding: 18px; border-radius: 12px; border: 1px solid var(--border); }

    .btn-info {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--c-purple); color: white;
      font-size: 12px; font-weight: bold; cursor: pointer; border: none;
      user-select: none; transition: transform 0.15s, background 0.15s;
    }
    .btn-info:hover { background: var(--c-purple-dark); transform: scale(1.15); }

    .btn-reset {
      background: var(--c-purple-light); color: var(--c-purple-dark); border: 1px solid var(--border);
      padding: 8px 16px; border-radius: 8px; font-weight: 700; font-size: 12.5px; cursor: pointer;
    }
    .btn-reset:hover { background: var(--c-purple); color: white; }

    .btn-action-vif {
      background: var(--c-purple); color: white; border: none;
      padding: 12px 24px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer;
      box-shadow: 0 4px 12px rgba(155, 93, 229, 0.3); transition: all 0.2s;
    }
    .btn-action-vif:hover { transform: translateY(-2px); background: #8644D0; }

    .preview-box {
      text-align: center; background: var(--c-bg); padding: 18px;
      border-radius: 12px; border: 2px dashed var(--c-purple); cursor: pointer; transition: background 0.2s;
    }
    .preview-box:hover { background: var(--c-purple-light); }

    .patho-block {
      background: white; border: 1px solid var(--border); border-radius: 14px;
      padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(60,27,112,0.04);
      position: relative;
    }
    .btn-remove-patho {
      position: absolute; top: 15px; right: 15px; background: #FFF5F5; color: var(--danger);
      border: 1px solid #FFD6D6; border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; font-weight: 700;
    }
    .btn-remove-patho:hover { background: var(--danger); color: white; }

    .exo-card {
      background: var(--c-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; position: relative;
    }

    #aiFloatBtn {
      position: fixed; bottom: 25px; right: 25px; background: var(--c-purple-dark); color: white;
      border: none; border-radius: 30px; padding: 14px 22px; font-weight: 700; font-size: 14px;
      cursor: pointer; box-shadow: 0 8px 25px rgba(60, 27, 112, 0.3); display: flex; align-items: center; gap: 8px; z-index: 999;
    }
    #aiChatWindow {
      display: none; position: fixed; bottom: 85px; right: 25px; width: 380px; height: 500px;
      background: white; border: 1px solid var(--border); border-radius: 16px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.15); flex-direction: column; overflow: hidden; z-index: 9999;
    }
    .ai-chat-header { background: var(--c-purple-dark); color: white; padding: 14px 18px; font-weight: 700; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
    .ai-chat-body { flex: 1; padding: 14px; overflow-y: auto; font-size: 13px; background: var(--c-bg); display: flex; flex-direction: column; gap: 10px; }
    .ai-chat-footer { padding: 12px; background: white; border-top: 1px solid var(--border); display: flex; gap: 8px; }

    .export-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 25px; }
    .btn-export { border: none; padding: 14px 18px; font-size: 14px; font-weight: 700; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; color: white; }
    .btn-docx { background: var(--c-purple); }
    .btn-doc-med { background: var(--c-purple-dark); }
    .btn-pdf { background: var(--c-green); }
