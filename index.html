<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilan Kinésithérapeute Expert EBP - Clinique Fay</title>
  <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <style>
    :root {
      /* Palette "Fay" - Adaptée UI/UX */
      --bg: #F4F3F0;               /* Fond très clair légèrement teinté sable */
      --card-bg: #FFFFFF;          /* Fond des cartes et formulaires */
      --text: #2B2D2F;             /* Texte principal sombre et lisible */
      --text-muted: #5D5C61;       /* Gris ardoise pour libellés & placeholders (#5D5C61) */
      --border: #D8D5CD;           /* Bordures fines d'inputs */

      /* Couleurs Principales (Actions & Navigation) */
      --primary: #557A95;          /* Bleu acier pour actions & onglets actifs (#557A95) */
      --primary-light: #E8EEF3;    /* Bleu très clair pour fonds de sélection */
      
      /* Touche Chaleureuse & Confirmation */
      --accent-sable: #B1A296;     /* Sable/Taupe pour badges, fonds blocs (#B1A296) */
      --success: #379683;          /* Gris-vert foncé pour succès (#379683) */
      --danger: #DC2626;           /* Rouge alerte standard */
      
      /* Assistant IA & Boutons sombres */
      --ai-color: #373A3C;         /* Ardoise très foncée */
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 30px 15px;
      margin: 0;
      line-height: 1.5;
    }

    .container {
      max-width: 1060px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(43, 45, 47, 0.05);
      margin-bottom: 90px;
      border: 1px solid var(--border);
    }

    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      background: var(--primary-light);
      color: var(--primary);
      width: 46px;
      height: 46px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      border: 1px solid #D1DFE9;
    }

    h1 { margin: 0; font-size: 21px; color: var(--text); font-weight: 800; letter-spacing: -0.3px; }
    .subtitle { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

    /* STEPPER / ONGLETS (Correction Hiérarchie) */
    .stepper {
      display: flex;
      justify-content: space-between;
      margin-bottom: 30px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      gap: 10px;
      overflow-x: auto;
    }

    .step-btn {
      flex: 1;
      background: none;
      border: none;
      padding: 12px 16px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 10px;
      transition: all 0.2s ease;
      display: flex; height: 100%; align-items: center; justify-content: center;
      white-space: nowrap;
    }

    .step-btn:hover { background: #EFEFEF; color: var(--text); }
    .step-btn.active {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 700;
    }

    /* SECTION TITLE (Clean & Professionnel) */
    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-light);
      padding: 12px 16px;
      border-left: 4px solid var(--primary);
      border-radius: 8px;
      margin: 20px 0 16px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* GRILLE AÉRÉE (Correction UX) */
    .grid { 
      display: grid; 
      grid-template-columns: repeat(2, 1fr); 
      gap: 22px 18px; /* Plus d'espace vertical entre les rangées */
    }
    .full-width { grid-column: 1 / -1; }

    label { font-weight: 600; font-size: 13px; color: var(--text); display: block; margin-bottom: 6px; }
    
    input[type="text"], input[type="date"], select, textarea, input[type="file"] {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13.5px;
      box-sizing: border-box;
      background: #fff;
      color: var(--text);
      transition: all 0.2s;
    }

    /* CONTRASTE REHAUSSÉ DES PLACEHOLDERS (Correction UX) */
    input::placeholder, textarea::placeholder {
      color: var(--text-muted) !important;
      opacity: 0.9;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(85, 122, 149, 0.15);
    }

    /* BLOCS UNIFIÉS EN GRIS LÉGER */
    .neutral-block {
      background: #F1F1EF;
      padding: 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    /* BOUTONS D'ACTION */
    .btn-reset {
      background: var(--accent-sable);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 12.5px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-reset:hover { background: #9E8F82; }

    .btn-step-action {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-step-action:hover { background: #44657B; }

    /* EVA STYLISÉ */
    .eva-box {
      background: #FFFFFF;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .eva-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    input[type="range"] { width: 100%; accent-color: var(--primary); cursor: pointer; padding: 0; border: none; }

    /* PREVIEW BODY CHART */
    .preview-box {
      text-align: center;
      background: var(--bg);
      padding: 16px;
      border-radius: 12px;
      border: 2px dashed var(--border);
      margin-top: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .preview-box:hover { background: #EDEDED; }

    /* WIDGET IA HARMONISÉ (Correction UX) */
    #aiFloatBtn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: var(--ai-color);
      color: white;
      border: none;
      border-radius: 30px;
      padding: 14px 22px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(43, 45, 47, 0.2);
      display: flex; align-items: center; gap: 8px;
    }

    /* MODALS */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(43, 45, 47, 0.6); backdrop-filter: blur(4px); z-index: 10000; justify-content: center; align-items: center;
    }
    .modal-content {
      background: white; width: 90%; max-width: 960px; height: 90vh; max-height: 880px; border-radius: 16px; padding: 25px; display: flex; flex-direction: column;
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px;
    }
    .modal-body { flex: 1; display: flex; justify-content: center; align-items: center; background: var(--bg); border-radius: 12px; margin-top: 14px; overflow: hidden; }
    
    /* BODY CHART ANATOMIQUE DÉTAILLÉ */
    #chartSVG { width: 100%; height: 100%; max-height: 800px; cursor: crosshair; }

    @media (max-width: 768px) {
      .container { padding: 20px 12px; }
      .grid { grid-template-columns: 1fr !important; }
      #chartSVG { max-height: 500px; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="brand-header">
      <div class="brand-icon">F</div>
      <div>
        <h1>BILAN KINÉSITHÉRAPIQUE EXPERT EBP</h1>
        <div class="subtitle">Raisonnement clinique & Précision diagnostique</div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <span style="font-size:12px; color:var(--success); font-weight:600; background:#EAF5F2; padding:6px 12px; border-radius:20px;">Sauvegarde auto 🟢</span>
      <button class="btn-reset">Nouveau Patient</button>
    </div>
  </header>

  <!-- NAVIGATION STEPPER -->
  <div class="stepper">
    <button class="step-btn active">1. Patient & Photos</button>
    <button class="step-btn">2. Anamnèse & Douleur</button>
    <button class="step-btn">3. Tests & Diagnostic IA</button>
    <button class="step-btn">4. Plan de Soins & Exports</button>
  </div>

  <!-- FORMULAIRE (Correction UX: Suppression titre redondant) -->
  <div class="grid">
    <div><label>Nom :</label><input type="text" placeholder="Nom du patient"></div>
    <div><label>Prénom :</label><input type="text" placeholder="Prénom"></div>
    <div><label>Date de naissance :</label><input type="date"></div>
    <div><label>Téléphone :</label><input type="text" placeholder="06 ..."></div>
    <div><label>Date du bilan :</label><input type="date"></div>
    <div><label>Prescription médicale & Motif :</label><input type="text" placeholder="Ex: Dr. Martin - 'Lombalgie'..."></div>
    <div><label>Activité physique / Profession :</label><input type="text" placeholder="Sédentaire, manutentionnaire..."></div>
    <div><label>Sport / Loisirs :</label><input type="text" placeholder="Discipline, fréquence..."></div>
    
    <div class="full-width neutral-block">
      <label>👤 Profil & Autonomie :</label>
      <select>
        <option>Sportif Compétiteur</option>
        <option>Sportif Loisir</option>
        <option>Sédentaire / Travailleur de bureau</option>
        <option>Travailleur de force</option>
        <option>Gériatrie / Perte d'autonomie</option>
      </select>
    </div>

    <div class="full-width neutral-block">
      <label>📷 Photos du dossier (Posture, imagerie, cicatrices) :</label>
      <input type="file" multiple>
    </div>

    <!-- PREVIEW BODY CHART -->
    <div class="full-width" style="margin-top:20px;">
      <label>📍 Schéma Corporel & Points de Douleur (Body Chart) :</label>
      <div class="preview-box" onclick="ouvrirModalChart()">
        <span id="markerCountText" style="font-size:13.5px; font-weight:600; color:var(--primary);">Aucun point marqué. Cliquez pour ouvrir l'éditeur anatomique.</span>
      </div>
    </div>
  </div>

  <div style="display:flex; justify-content:flex-end; margin-top:30px;">
    <button class="btn-step-action">Suivant : Anamnèse ➔</button>
  </div>
</div>

<button id="aiFloatBtn">🤖 Assistant IA EBP</button>

<!-- MODAL BODY CHART ANATOMIQUE DÉTAILLÉ -->
<div id="chartModal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <div>
        <h3 style="margin:0; font-size:18px; color:var(--text);">Éditeur de Pointage de Douleur</h3>
        <small style="color:var(--text-muted);">Cliquez sur l'anatomie pour poser une marque de douleur (Cercle Rouge).</small>
      </div>
      <div style="display:flex; gap:10px;">
        <button onclick="effacerMarqueurs()" style="background:var(--danger); color:white; border:none; padding:8px 16px; border-radius:8px; font-weight:600; cursor:pointer;">Effacer tout</button>
        <button onclick="fermerModalChart()" style="background:var(--primary); color:white; border:none; padding:8px 16px; border-radius:8px; font-weight:600; cursor:pointer;">Valider & Fermer ✕</button>
      </div>
    </div>
    <div class="modal-body">
      <!-- SVG ANATOMIQUE HAUTE PRÉCISION -->
      <svg id="chartSVG" viewBox="0 0 700 850" xmlns="http://www.w3.org/2000/svg">
        <rect width="700" height="850" fill="#F4F3F0"/>
        
        <text x="180" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#2B2D2F">VUE ANTÉRIEURE</text>
        <text x="520" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#2B2D2F">VUE POSTÉRIEURE</text>

        <!-- Modèle Antérieur Détaillé -->
        <g id="bodyFront" fill="#D8D5CD" stroke="#5D5C61" stroke-width="1.5">
          <!-- Tête & Cou -->
          <ellipse cx="180" cy="80" rx="30" ry="35"/><path d="M 165 110 L 165 130 L 195 130 L 195 110 Z"/>
          <!-- Tronc -->
          <path d="M 120 135 C 150 125, 210 125, 240 135 L 230 320 L 130 320 Z"/>
          <line x1="180" y1="130" x2="180" y2="320" stroke-width="1" stroke-dasharray="3"/>
          <!-- Bras Droit -->
          <circle cx="110" cy="145" r="15" fill="#C4C1B9"/><!-- Épaule -->
          <path d="M 95 145 L 75 250 L 85 320 L 105 320 L 115 250 Z"/><!-- Bras+Avant-bras -->
          <circle cx="80" cy="250" r="10" fill="#B1A296"/><!-- Coude -->
          <ellipse cx="95" cy="335" rx="12" ry="18"/><!-- Main -->
          <!-- Bras Gauche -->
          <circle cx="250" cy="145" r="15" fill="#C4C1B9"/><!-- Épaule -->
          <path d="M 265 145 L 285 250 L 275 320 L 255 320 L 245 250 Z"/><!-- Bras+Avant-bras -->
          <circle cx="280" cy="250" r="10" fill="#B1A296"/><!-- Coude -->
          <ellipse cx="265" cy="335" rx="12" ry="18"/><!-- Main -->
          <!-- Bassin & Jambes -->
          <path d="M 130 320 L 180 360 L 230 320 L 225 370 L 135 370 Z"/>
          <!-- Jambe Droite -->
          <path d="M 135 370 L 130 520 L 140 680 L 165 680 L 170 520 L 160 370 Z"/>
          <circle cx="130" cy="520" r="14" fill="#B1A296"/><!-- Genou -->
          <ellipse cx="140" cy="690" rx="10" ry="12" fill="#C4C1B9"/><!-- Cheville -->
          <path d="M 130 700 L 115 740 L 150 740 Z"/><!-- Pied -->
          <!-- Jambe Gauche -->
          <path d="M 225 370 L 230 520 L 220 680 L 195 680 L 190 520 L 200 370 Z"/>
          <circle cx="230" cy="520" r="14" fill="#B1A296"/><!-- Genou -->
          <ellipse cx="220" cy="690" rx="10" ry="12" fill="#C4C1B9"/><!-- Cheville -->
          <path d="M 230 700 L 245 740 L 210 740 Z"/><!-- Pied -->
        </g>

        <!-- Modèle Postérieur Détaillé -->
        <g id="bodyBack" fill="#D8D5CD" stroke="#5D5C61" stroke-width="1.5">
          <!-- Tête & Cou -->
          <ellipse cx="520" cy="80" rx="30" ry="35"/><path d="M 505 110 L 505 130 L 535 130 L 535 110 Z"/>
          <!-- Tronc & Colonne -->
          <path d="M 460 135 C 490 125, 550 125, 580 135 L 570 320 L 470 320 Z"/>
          <line x1="520" y1="130" x2="520" y2="320" stroke="#475569" stroke-width="2"/> <!-- Colonne vertébrale -->
          <!-- Bras Gauche (Post) -->
          <circle cx="450" cy="145" r="15" fill="#C4C1B9"/>
          <path d="M 435 145 L 415 250 L 425 320 L 445 320 L 455 250 Z"/>
          <circle cx="420" cy="250" r="10" fill="#B1A296"/>
          <ellipse cx="435" cy="335" rx="12" ry="18"/>
          <!-- Bras Droit (Post) -->
          <circle cx="590" cy="145" r="15" fill="#C4C1B9"/>
          <path d="M 605 145 L 625 250 L 615 320 L 595 320 L 585 250 Z"/>
          <circle cx="620" cy="250" r="10" fill="#B1A296"/>
          <ellipse cx="605" cy="335" rx="12" ry="18"/>
          <!-- Bassin & Fessiers -->
          <path d="M 470 320 C 490 380, 550 380, 570 320 L 565 370 L 475 370 Z"/>
          <!-- Jambe Gauche (Post) -->
          <path d="M 475 370 L 480 520 L 470 680 L 495 680 L 500 520 L 510 370 Z"/>
          <circle cx="480" cy="520" r="14" fill="#B1A296"/>
          <ellipse cx="470" cy="690" rx="10" ry="12" fill="#C4C1B9"/>
          <path d="M 480 700 L 495 740 L 460 740 Z"/>
          <!-- Jambe Droite (Post) -->
          <path d="M 565 370 L 560 520 L 570 680 L 545 680 L 540 520 L 530 370 Z"/>
          <circle cx="560" cy="520" r="14" fill="#B1A296"/>
          <ellipse cx="570" cy="690" rx="10" ry="12" fill="#C4C1B9"/>
          <path d="M 560 700 L 545 740 L 580 740 Z"/>
        </g>
        
        <!-- Calque des marqueurs -->
        <g id="markersLayer"></g>
      </svg>
    </div>
  </div>
</div>

<script>
  let markers = [];
  
  function ouvrirModalChart() { document.getElementById('chartModal').style.display = 'flex'; }
  function fermerModalChart() { document.getElementById('chartModal').style.display = 'none'; }

  const svg = document.getElementById('chartSVG');
  const markersLayer = document.getElementById('markersLayer');

  // Gestion du clic pour poser/enlever un marqueur
  svg.addEventListener('click', function(e) {
    // Si on clique sur un marqueur existant, on l'enlève
    if (e.target.classList.contains('pain-marker')) {
      const idx = parseInt(e.target.getAttribute('data-index'));
      markers.splice(idx, 1);
      rendreMarqueurs();
      return;
    }

    // Sinon, on convertit les coordonnées et on pose un marqueur
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
    
    markers.push({ x: Math.round(svgP.x), y: Math.round(svgP.y) });
    rendreMarqueurs();
  });

  // Rendu graphique des marqueurs (Cercles rouges translucides)
  function rendreMarqueurs() {
    markersLayer.innerHTML = ''; // Effacer le calque
    
    markers.forEach((m, idx) => {
      const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      circle.setAttribute("cx", m.x);
      circle.setAttribute("cy", m.y);
      circle.setAttribute("r", "12"); // Taille du marqueur
      circle.setAttribute("fill", "rgba(220, 38, 38, 0.7)"); // Rouge Alerte translucide
      circle.setAttribute("stroke", "#FFFFFF");
      circle.setAttribute("stroke-width", "2");
      circle.setAttribute("class", "pain-marker");
      circle.setAttribute("data-index", idx);
      circle.setAttribute("style", "cursor: pointer;");
      
      markersLayer.appendChild(circle);
    });

    // Mise à jour du texte de preview sur le formulaire
    const textEl = document.getElementById('markerCountText');
    if (markers.length > 0) {
      textEl.innerText = `✓ ${markers.length} zone(s) de douleur identifiée(s) sur le Body Chart.`;
      textEl.style.color = "var(--success)";
    } else {
      textEl.innerText = "Aucun point marqué. Cliquez pour ouvrir l'éditeur anatomique.";
      textEl.style.color = "var(--primary)";
    }
  }

  function effacerMarqueurs() {
    if (markers.length > 0 && confirm("Effacer tous les points de douleur ?")) {
      markers = [];
      rendreMarqueurs();
    }
  }
</script>

</body>
</html>
