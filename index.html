<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schéma Corporel Géométrique Kiné</title>
  <style>
    :root {
      --bg-color: #FAF5FF;
      --primary: #9B5DE5;
      --dark: #3C1B70;
      --joint-color: #F1C40F; /* Cercles pour les articulations */
      --bone-color: #CFF7EA;  /* Rectangles pour les os longs */
      --bone-stroke: #124D41;
      --danger: #E74C3C;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }

    h2 { margin-bottom: 5px; }
    p { margin-top: 0; color: #666; font-size: 14px; text-align: center; }

    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(60, 27, 112, 0.1);
      border: 1px solid #E9D5FF;
      max-width: 600px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .legend {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
      font-size: 13px;
      font-weight: bold;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-circle {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--joint-color);
      border: 1.5px solid var(--dark);
    }

    .legend-rect {
      width: 16px;
      height: 10px;
      background: var(--bone-color);
      border: 1.5px solid var(--bone-stroke);
      border-radius: 2px;
    }

    #svgBody {
      width: 100%;
      max-width: 400px;
      height: auto;
      background: #FFFFFF;
      border: 1px solid #E9D5FF;
      border-radius: 12px;
      cursor: crosshair;
    }

    .controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #8644D0;
    }

    button.clear {
      background: var(--danger);
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Schéma Géométrique Anatomique</h2>
    <p>Cliquez sur le schéma pour placer ou retirer des repères de douleur (✕).</p>

    <div class="legend">
      <div class="legend-item">
        <div class="legend-circle"></div> Articulations (Ronds)
      </div>
      <div class="legend-item">
        <div class="legend-rect"></div> Os longs (Rectangles)
      </div>
    </div>

    <!-- SCHÉMA GÉOMÉTRIQUE SVG -->
    <svg id="svgBody" viewBox="0 0 400 650" xmlns="http://www.w3.org/2000/svg">
      <!-- Fond neutre -->
      <rect width="400" height="650" fill="#FAF5FF" rx="12"/>

      <!-- GROUPE ANATOMIQUE GÉOMÉTRIQUE -->
      <g stroke="#3C1B70" stroke-width="2">
        
        <!-- TÊTE & TRONC -->
        <!-- Tête (Cercle) -->
        <circle cx="200" cy="50" r="28" fill="#F3E8FF"/>
        <!-- Rachis/Tronc (Rectangle central) -->
        <rect x="180" y="85" width="40" height="150" rx="5" fill="#F3E8FF"/>

        <!-- MEMBRES SUPÉRIEURS (BRAS) -->
        <!-- Épaules (Ronds) -->
        <circle cx="150" cy="95" r="14" fill="#F1C40F"/>
        <circle cx="250" cy="95" r="14" fill="#F1C40F"/>

        <!-- Humerus (Rectangles os longs) -->
        <rect x="130" y="115" width="16" height="65" rx="4" fill="#CFF7EA" stroke="#124D41"/>
        <rect x="254" y="115" width="16" height="65" rx="4" fill="#CFF7EA" stroke="#124D41"/>

        <!-- Coudes (Ronds) -->
        <circle cx="138" cy="190" r="10" fill="#F1C40F"/>
        <circle cx="262" cy="190" r="10" fill="#F1C40F"/>

        <!-- Avant-bras / Radius-Cubitus (Rectangles os longs) -->
        <rect x="131" y="205" width="14" height="60" rx="3" fill="#CFF7EA" stroke="#124D41"/>
        <rect x="255" y="205" width="14" height="60" rx="3" fill="#CFF7EA" stroke="#124D41"/>

        <!-- Poignets & Mains (Ronds) -->
        <circle cx="138" cy="272" r="8" fill="#F1C40F"/>
        <circle cx="262" cy="272" r="8" fill="#F1C40F"/>

        <!-- MEMBRES INFÉRIEURS (JAMBES) -->
        <!-- Bassin / Hanches (Ronds) -->
        <circle cx="170" cy="245" r="16" fill="#F1C40F"/>
        <circle cx="230" cy="245" r="16" fill="#F1C40F"/>

        <!-- Fémurs (Rectangles os longs) -->
        <rect x="158" y="270" width="22" height="130" rx="6" fill="#CFF7EA" stroke="#124D41"/>
        <rect x="220" y="270" width="22" height="130" rx="6" fill="#CFF7EA" stroke="#124D41"/>

        <!-- Genoux (Ronds) -->
        <circle cx="169" cy="412" r="15" fill="#F1C40F"/>
        <circle cx="231" cy="412" r="15" fill="#F1C40F"/>

        <!-- Tibias / Péronés (Rectangles os longs) -->
        <rect x="160" y="435" width="18" height="120" rx="5" fill="#CFF7EA" stroke="#124D41"/>
        <rect x="222" y="435" width="18" height="120" rx="5" fill="#CFF7EA" stroke="#124D41"/>

        <!-- Chevilles (Ronds) -->
        <circle cx="169" cy="565" r="11" fill="#F1C40F"/>
        <circle cx="231" cy="565" r="11" fill="#F1C40F"/>

        <!-- Pieds (Rectangles/Formes de base) -->
        <rect x="150" y="580" width="24" height="35" rx="4" fill="#F3E8FF"/>
        <rect x="226" y="580" width="24" height="35" rx="4" fill="#F3E8FF"/>

      </g>

      <!-- Calque pour les croix de douleur rouges (✕) -->
      <g id="markersLayer"></g>
    </svg>

    <div class="controls">
      <button class="clear" onclick="effacerMarqueurs()">Effacer les croix</button>
    </div>
  </div>

  <script>
    const svg = document.getElementById('svgBody');
    const markersLayer = document.getElementById('markersLayer');
    let markers = [];

    svg.addEventListener('click', function(e) {
      // Si on clique sur une croix existante, on la supprime
      if (e.target.classList.contains('pain-marker')) {
        const idx = parseInt(e.target.getAttribute('data-index'));
        markers.splice(idx, 1);
        rendreMarqueurs();
        return;
      }

      // Calcul des coordonnées par rapport au viewBox SVG
      const pt = svg.createSVGPoint();
      pt.x = e.clientX;
      pt.y = e.clientY;
      const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());

      markers.push({ x: Math.round(svgP.x), y: Math.round(svgP.y) });
      rendreMarqueurs();
    });

    function rendreMarqueurs() {
      markersLayer.innerHTML = '';
      markers.forEach((m, idx) => {
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", m.x);
        text.setAttribute("y", m.y + 7);
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("fill", "#E74C3C");
        text.setAttribute("font-size", "22");
        text.setAttribute("font-weight", "900");
        text.setAttribute("class", "pain-marker");
        text.setAttribute("data-index", idx);
        text.setAttribute("style", "cursor: pointer; user-select: none;");
        text.textContent = "✕";
        markersLayer.appendChild(text);
      });
    }

    function effacerMarqueurs() {
      markers = [];
      rendreMarqueurs();
    }
  </script>
</body>
</html>
